version: '3.8'

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB:       genbi
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:                postgresql://postgres:postgres123@db:5432/genbi
      GROQ_API_KEY:                ${GROQ_API_KEY}
      SECRET_KEY:                  ${SECRET_KEY}
      ALGORITHM:                   HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      REDIS_URL:                   redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: